<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;                   /* CHANGED: was 100vh */
            overflow: hidden;
            background-color: #0b0b0c;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            display: block;                 /* CHANGED: was flex; the #fit wrapper below now does the flex layout */
            padding: 20px;
        }

        /* CHANGED: new, this wrapper holds your original layout and gets scaled to fit */
        #fit {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transform-origin: top left;
        }

        /* TOP: Hero Time & Weather */
        .top-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 5px 0;
        }

        #clock {
            font-size: clamp(90px, 14vw, 180px);
            font-weight: 700;
            line-height: 0.85;
            letter-spacing: -3px;
        }

        #clock .ampm {
            font-size: 0.45em;
            font-weight: 500;
            margin-left: 8px;
            vertical-align: middle;
        }

        #date {
            font-size: clamp(24px, 3vw, 36px);
            color: #8a8a8f;
            font-weight: 400;
            margin-top: 6px;
            margin-bottom: 12px;
        }

        .weather-group {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 18px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        #weather-temp {
            font-size: 22px;
            font-weight: 500;
            color: #00bcd4;
        }

        #weather-desc {
            font-size: 15px;
            color: #8a8a8f;
        }

        /* BOTTOM: 3-Column Bus Display */
        .bottom-section {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
        }

        .bus-refresh-notice {
            text-align: center;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #66666e;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .bus-columns-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr); 
            gap: 16px;
            width: 100%;
        }

        .bus-station-column {
            background: #121214;
            border: 1px solid #222;
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .bus-station-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 6px;
            margin-bottom: 2px;
        }

        .station-name {
            font-size: 1.5rem;
            font-weight: 700;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .station-code {
            font-size: 1.2rem;
            color: #8a8a8f;
            background: rgba(255, 255, 255, 0.06);
            padding: 2px 6px;
            border-radius: 4px;
        }

        .bus-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #18181c;
            padding: 6px 10px;
            border-radius: 6px;
        }

        .bus-number {
            font-size: 1.8rem;
            font-weight: bold;
            color: #ffffff;
        }

        .bus-timings {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .timing-pill {
            font-size: 2rem;
            font-weight: 500;
            padding: 2px 6px;  /* Added extra padding so text isn't cramped */
            font-weight: 500;
            color: #8a8a8f;
        }

        .timing-pill.next {
            color: #4caf50;
            font-weight: 700;
        }

        .timing-pill.subsequent {
            color: #ffffff;
        }

        .timing-pill.load-sea { color: #00FF66; border-color: #00FF66; } /* Green - Low Crowd */
        .timing-pill.load-sda { color: #FFFF00; border-color: #FFFF00; } /* Yellow - Moderate */
        .timing-pill.load-lsd { color: #FF0000; border-color: #FF0000; } /* Red - Crowded */
    </style>
</head>
<body>

    <div id="fit">   <!-- CHANGED: new opening tag -->

    <!-- TOP: Clock, Date & Weather -->
    <div class="top-section">
        <div id="clock">00:00</div>
        <div id="date">Loading status...</div>
        
        <div class="weather-group">
            <div id="weather-temp">--°C</div>
            <div id="weather-desc">Loading...</div>
        </div>
    </div>

    <!-- BOTTOM: 3 Bus Stations Layout -->
    <div class="bottom-section">
        <div class="bus-refresh-notice" id="refresh-timer">Refreshing in 10s...</div>
        <div class="bus-columns-grid" id="bus-container">
            <!-- Dynamically populated via JS -->
        </div>
    </div>

    </div>           <!-- CHANGED: new closing tag -->

    <script>
        // ================= CONFIGURATION =================      
        const LATITUDE = "1.400962806513855"; // Your local latitude (Default: Singapore)
        const LONGITUDE = "103.89462937852629"; // Your local longitude
        // =================================================

        // --- 1. CLOCK & DATE LOGIC ---
        function updateClock() {
            const now = new Date();
            
            // Format time with small AM/PM
            const timeStr = now.toLocaleTimeString('en-SG', { hour: '2-digit', minute: '2-digit', hour12: true });
            const [time, period] = timeStr.split(' ');
            document.getElementById('clock').innerHTML = `${time} <span class="ampm">${period.toUpperCase()}</span>`;
            
            // Format date
            const options = { weekday: 'long', day: 'numeric', month: 'short' };
            document.getElementById('date').innerText = now.toLocaleDateString('en-SG', options);
        }

        // Run immediately and update every second
        updateClock();
        setInterval(updateClock, 1000);
        
        // --- 2. Open-Meteo Weather API Integration (No key needed) ---
        // WMO Code Translation Helper
        function interpretWMO(code) {
            if (code === 0) return "Clear Sky";
            if ([1, 2, 3].includes(code)) return "Partly Cloudy";
            if ([45, 48].includes(code)) return "Foggy";
            if ([51, 53, 55, 61, 63, 65, 80, 81, 82].includes(code)) return "Rainy";
            if ([95, 96, 99].includes(code)) return "Thunderstorm";
            return "Cloudy";
        }

        async function fetchWeather() {
            try {
                const url = `https://api.open-meteo.com/v1/forecast?latitude=${LATITUDE}&longitude=${LONGITUDE}&current_weather=true`;
                const response = await fetch(url);
                if (!response.ok) throw new Error("Network response error");
                const data = await response.json();
                
                const temp = Math.round(data.current_weather.temperature);
                const condition = interpretWMO(data.current_weather.weathercode);
                
                document.getElementById('weather-temp').innerText = `${temp}°C`;
                document.getElementById('weather-desc').innerText = condition;
            } catch (error) {
                console.error("Weather update failed:", error);
                document.getElementById('weather-desc').innerText = "Weather Sync Error";
            }
        }
        // Weather updates every 15 minutes to save data usage
        setInterval(fetchWeather, 900000); 
        fetchWeather();        

        // Define your target 3 bus stations and up to 5 bus services each
        // --- 3. BUS DATA REFRESH LOGIC ---        

        // Define your target 3 bus stations and up to 5 bus services each
        const BUS_STATIONS = [
            { code: "65539", name: "Blk 224A", interestedBuses: ["104", "382W"] },
            { code: "65531", name: "Blk 226A", interestedBuses: ["104", "382G"] },
            { code: "65439", name: "Blk 220C", interestedBuses: ["39", "43", "104", "117", "118", "119"] },
            { code: "65431", name: "Twin Waterfalls", interestedBuses: ["39", "43", "104", "117", "118", "119"] }
        ];

        // Return null for buses that arrived more than 45 seconds ago
        function calculateETA(arrivalTimeStr) {
            if (!arrivalTimeStr) return null;
            
            // Time difference in milliseconds with your 30s buffer
            const diffMs = (new Date(arrivalTimeStr) - new Date()) - 30000;
            const diffSeconds = diffMs / 1000;
            
            // If the bus arrived more than 20 seconds ago, mark it as expired/passed
            if (diffSeconds < -20) {
                return "EXPIRED"; 
            }
            
            const diffMins = Math.round(diffMs / 60000);
            if (diffMins <= 0) return "Arr";
            return `${diffMins}`; 
        }

        // Maps LTA Load values ("SEA", "SDA", "LSD") to corresponding CSS class names
        function getLoadClass(loadCode) {
            switch (loadCode) {
                case "SEA": return "load-sea"; // Seats Available (Green)
                case "SDA": return "load-sda"; // Standing Available (Yellow)
                case "LSD": return "load-lsd"; // Limited Standing (Red)
                default: return "";
            }
        }

        // Fetch data from serverless API endpoint
        async function fetchBusArrivals() {
            try {
                // 1. Single API call to your bundled backend handler
                const response = await fetch('/api/bus-all');
                
                if (!response.ok) {
                    console.error("Failed to fetch bus data");
                    return;
                }

                // Returns an array of bus stop data objects in the same order as STATIONS
                const allStopsData = await response.json();

                // 2. Loop through each station and render using the matching data index
                BUS_STATIONS.forEach((station, index) => {
                    const stopData = allStopsData[index];
                    const rawServices = stopData?.Services || [];
                    
                // FILTER: If interestedBuses is defined, keep only matching bus numbers
                const filteredServices = rawServices.filter(bus => 
                        station.interestedBuses.includes(bus.ServiceNo)
                    );
                
                // Sort filtered buses based on the order defined in your array
                filteredServices.sort((a, b) => 
                    station.interestedBuses.indexOf(a.ServiceNo) - station.interestedBuses.indexOf(b.ServiceNo)
                );

                    renderStationColumn(station, filteredServices);
                });

            } catch (error) {
                console.error("Error updating bus dashboard:", error);
            }
        }

        // Helper function to build and attach station columns
        function renderStationColumn(station, servicesData) {
            const container = document.getElementById('bus-container');

            let col = document.getElementById(`station-${station.code}`);
            if (!col) {
                col = document.createElement('div');
                col.id = `station-${station.code}`;
                col.className = 'bus-station-column';
                container.appendChild(col);
            }

            let rowsHtml = '';
            
            servicesData.forEach(bus => {
                const eta1 = calculateETA(bus.NextBus?.EstimatedArrival);
                const load1 = getLoadClass(bus.NextBus?.Load);

                const eta2 = calculateETA(bus.NextBus2?.EstimatedArrival);
                const load2 = getLoadClass(bus.NextBus2?.Load);

                const eta3 = calculateETA(bus.NextBus3?.EstimatedArrival);
                const load3 = getLoadClass(bus.NextBus3?.Load);

                // SHIFT LOGIC: If NextBus has passed ("EXPIRED"), shift NextBus2 into the first slot
                let activeEta1 = eta1;
                let activeLoad1 = load1;
                let activeEta2 = eta2;
                let activeLoad2 = load2;
                let activeEta3 = eta3;
                let activeLoad3 = load3;

                if (eta1 === "EXPIRED") {
                    activeEta1 = eta2;
                    activeLoad1 = load2;
                    activeEta2 = eta3;
                    activeLoad2 = load3;
                    activeEta3 = null;
                }

                // Only render pills if data exists and hasn't expired
                const pill1 = activeEta1 && activeEta1 !== "EXPIRED" ? `<span class="timing-pill next ${activeLoad1}">${activeEta1}</span>` : '';
                const pill2 = activeEta2 && activeEta2 !== "EXPIRED" ? `<span class="timing-pill subsequent ${activeLoad2}">${activeEta2}</span>` : '';
                const pill3 = activeEta3 && activeEta3 !== "EXPIRED" ? `<span class="timing-pill ${activeLoad3}">${activeEta3}</span>` : '';
                
                // only put 2 timing for each bus, pill3 is removed
                rowsHtml += `
                    <div class="bus-row">
                        <span class="bus-number">${bus.ServiceNo}</span>
                        <div class="bus-timings">
                            ${pill1}
                            ${pill2}                           
                        </div>
                    </div>
                `;
            });

            if (servicesData.length === 0) {
                rowsHtml = `<div style="font-size: 12px; color: #666; padding: 10px;">No operating buses found</div>`;
            }

            col.innerHTML = `
                <div class="bus-station-header">
                    <span class="station-name">${station.name}</span>
                    <span class="station-code">${station.code}</span>
                </div>
                ${rowsHtml}
            `;
        }

                // --- CONFIGURATION ---
        const POLL_INTERVAL = 20; // Fetch every 20 seconds
        let countdown = POLL_INTERVAL;

        // Check if current time is within operating hours (6:00 AM to 11:59 PM)
        function isOperatingHours() {
            const hour = new Date().getHours();
            return hour >= 6 && hour < 24; // True between 06:00 and 23:59
        }

        // UI Update Function
        function updateCountdownUI() {
            const refreshText = document.getElementById('refresh-timer');
            if (!refreshText) return;

            if (!isOperatingHours()) {
                refreshText.innerText = "Kiosk Paused (Night Mode 12AM-6AM)";
                return;
            }
            refreshText.innerText = `Refreshing in ${countdown}s...`;
        }

        // Master Fetch Trigger
        async function triggerBusRefresh() {
            if (!isOperatingHours()) {
                console.log("Outside operating hours (6AM - 12AM). Fetch skipped.");
                updateCountdownUI();
                return;
            }

            countdown = POLL_INTERVAL;
            updateCountdownUI();
            
            await fetchBusArrivals();
        }

        // 1-Second Master Interval Loop
        setInterval(() => {
            if (!isOperatingHours()) {
                updateCountdownUI();
                return;
            }

            countdown--;
            
            if (countdown <= 0) {
                triggerBusRefresh();
            } else {
                updateCountdownUI();
            }
        }, 1000);

        // Initial Execution on Load
        triggerBusRefresh();

        // ===== CHANGED: new, shrink-to-fit so everything is always on one screen =====
        const fitEl = document.getElementById('fit');

        function fitToScreen() {
            const pad = 20;                                  // matches body padding
            const availW = window.innerWidth  - pad * 2;
            const availH = window.innerHeight - pad * 2;

            // Measure natural size at 100% scale
            fitEl.style.transform = 'none';
            fitEl.style.width  = availW + 'px';
            fitEl.style.height = 'auto';
            const natW = Math.max(fitEl.scrollWidth,  availW);
            const natH = fitEl.scrollHeight;

            // Never scale above 1, so your current sizes are the maximum
            const scale = Math.min(1, availW / natW, availH / natH);

            // Enlarge the layout box by 1/scale so the scaled result fills the screen exactly
            fitEl.style.width     = (availW / scale) + 'px';
            fitEl.style.height    = (availH / scale) + 'px';
            fitEl.style.transform = `scale(${scale})`;
        }

        fitToScreen();
        window.addEventListener('resize', fitToScreen);
        window.addEventListener('orientationchange', fitToScreen);

        // Re-fit whenever bus rows change (more or fewer buses, "No operating buses" etc.)
        new MutationObserver(fitToScreen).observe(
            document.getElementById('bus-container'),
            { childList: true, subtree: true }
        );
        
    </script>
</body>
</html>
